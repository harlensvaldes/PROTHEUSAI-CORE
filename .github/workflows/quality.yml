name: EPF Governance Checks
on:
  push:
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/quality_cli.py validate
      - run: python -m unittest discover -s tests -v
      # Integrar aquí los tests del producto al decidir stack.
